name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per ref. Runs on a branch or PR may cancel each other, but nothing cancels a run on main:
# a push to main queues behind a running deploy instead of cutting it off mid-flight, and a
# branch run can never cancel a deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Drives the 3D hall and the globe in a real browser (software GL): gestures, colours, hit-testing,
  # idle rendering. One job per suite, in parallel with each other and with `build`; it gates the
  # deploy because the bugs it exists for are exactly the ones unit tests cannot see.
  # Decisions and numbers: docs/decisions/0002-ci-gate-for-the-3d-hall.md, 0003-idle-rendering-for-the-globe.md
  verify-3d:
    name: verify-3d (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [hall, globe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the browser is pinned to the playwright-core version, so the run is the same browser every time
      - id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run verify:${{ matrix.suite }}
        env:
          VERIFY_OUT: ${{ runner.temp }}/verify-3d # the `runner` context exists in steps, not in job-level env
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.suite }}-screenshots
          path: ${{ runner.temp }}/verify-3d
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, verify-3d]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
